e" aria-label="נוסח המודעה להעתקה" readonly hidden style="width:100%;min-height:160px"></textarea><p><a class="action" href="https://chat.whatsapp.com/EUOjk9FN8PeHu8zRY08g4K?s=cl&amp;p=a&amp;mlu=4&amp;ilr=4" target="_blank" rel="noopener noreferrer">פתיחת קבוצת הוואטסאפ</a></p></div></section><section><button type="button" class="action primary" id="toggle-milestone-form" aria-expanded="false" aria-controls="milestone-compose">שליחת ציון דרך</button><div id="milestone-compose" hidden><h2>ציון דרך לפרסום</h2><p>ציון הדרך יופיע בלוח ההודעות תוך כמה דקות.</p><form id="milestone-form" class="notice-form"><label>שם<input name="name" required maxlength="60"></label><label>ציון הדרך<input name="milestone" required maxlength="60" placeholder="למשל: שנה אחת נקיון"></label><label>פגישה<input name="meeting" required maxlength="80" placeholder="למשל: גן דבורה"></label><label>תאריך<input name="date" type="date" required></label><label>שעה<input name="time" type="time" required></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)"><button type="submit" class="action primary">שליחה</button></form><p id="milestone-status" class="status" role="status"></p><textarea id="prepared-milestone" aria-label="נוסח ציון הדרך להעתקה" readonly hidden style="width:100%;min-height:120px"></textarea><p><a class="action" href="https://chat.whatsapp.com/EUOjk9FN8PeHu8zRY08g4K?s=cl&amp;p=a&amp;mlu=4&amp;ilr=4" target="_blank" rel="noopener noreferrer">פתיחת קבוצת הוואטסאפ</a></p></div></section></div></main><footer>מכורים אנונימיים · תל אביב–יפו<br></footer><script>const noticeToggle=document.getElementById("toggle-notice-form");const noticeCompose=document.getElementById("notice-compose");noticeToggle.addEventListener("click",()=>{const expanded=noticeToggle.getAttribute("aria-expanded")==="true";noticeToggle.setAttribute("aria-expanded",String(!expanded));noticeCompose.hidden=expanded;});const milestoneToggle=document.getElementById("toggle-milestone-form");const milestoneCompose=document.getElementById("milestone-compose");milestoneToggle.addEventListener("click",()=>{const expanded=milestoneToggle.getAttribute("aria-expanded")==="true";milestoneToggle.setAttribute("aria-expanded",String(!expanded));milestoneCompose.hidden=expanded;});if(location.hash==="#milestone"){milestoneToggle.setAttribute("aria-expanded","true");milestoneCompose.hidden=false;milestoneToggle.scrollIntoView({block:"start"});}const milestoneForm=document.getElementById("milestone-form");milestoneForm.addEventListener("submit",async e=>{e.preventDefault();const data=new FormData(milestoneForm);const status=document.getElementById("milestone-status");if(window.NA_MILESTONES_URL){const button=milestoneForm.querySelector("button[type=submit]");button.disabled=true;status.textContent="שולח…";try{const r=await fetch(window.NA_MILESTONES_URL,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.fromEntries(data))});const j=await r.json();if(!j.ok)throw 0;milestoneForm.reset();status.textContent="תודה! ציון הדרך נשלח ויופיע בלוח ההודעות תוך כמה דקות."}catch{status.textContent="השליחה לא הצליחה. אפשר לנסות שוב, או לשלוח את הפרטים בקבוצת הוואטסאפ."}button.disabled=false;return}const english=window.NA_I18N?.en;const [y,m,d]=String(data.get("date")).split("-").map(Number);const day=new Date(y,m-1,d);const when=english?day.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}):"יום "+day.toLocaleDateString("he-IL",{weekday:"long"}).replace(/^יום /,"")+", "+d+"."+m;const text=(english?"Milestone: ":"ציון דרך: ")+data.get("name")+" – "+data.get("milestone")+"\n"+data.get("meeting")+", "+when+(english?" at ":", בשעה ")+data.get("time");const out=document.getElementById("prepared-milestone");out.hidden=false;out.value=text;out.focus();out.select();try{await navigator.clipboard.writeText(text);status.textContent="הנוסח הועתק. אפשר להדביק אותו בקבוצת הוואטסאפ. ציון הדרך עדיין לא נשלח ולא פורסם."}catch{status.textContent="הנוסח מוכן להעתקה. ציון הדרך עדיין לא נשלח ולא פורסם."}});</script></body></html>
